name: prestapp
description: "PrestApp — controla qué objetos personales prestas y a quién."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.4.3
  path: ^1.9.0
  image_picker: ^1.0.7
  shared_preferences: ^2.5.5
  intl: 0.20.2
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icon/icon.png"

  adaptive_icon_foreground: "assets/icon/foreground_app.png"
  adaptive_icon_background: "#3D8C68"